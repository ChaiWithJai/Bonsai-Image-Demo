name: Platform smoke tests

# Manual via Actions tab, or by adding the `smoke-test` label to a PR
# (label-add only; re-running means remove + re-add the label).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon — full e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache HF model (ternary-mlx)
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/bonsai-image-4B-ternary-mlx
          key: ${{ runner.os }}-${{ runner.arch }}-model-ternary-mlx-v1

      - name: Run setup.sh
        env:
          SKIP_DOWNLOAD: "1"
        run: ./setup.sh

      - name: Download ternary-mlx model (cache miss)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: ./scripts/download_model.sh --model ternary-mlx

      - name: Generate five controlled terrain candidates
        run: |
          mkdir -p outputs/terrain/prompt-study

          ./scripts/generate.sh \
            --prompt "Absolute top-down view of a volcanic island with radial ridges and a central crater, camera directly overhead at 90 degrees, orthographic projection, grayscale elevation map, black sea level, white mountain summit" \
            --size 512x512 \
            --steps 4 \
            --seed 42 \
            --output outputs/terrain/prompt-study/01-direct-camera.png

          ./scripts/generate.sh \
            --prompt "GIS digital elevation model raster of a volcanic island with radial ridges and a central crater, orthographic nadir map, smooth grayscale altitude values, black zero-elevation ocean, brighter pixels at higher elevations, square dataset" \
            --size 512x512 \
            --steps 4 \
            --seed 42 \
            --output outputs/terrain/prompt-study/02-gis-dem.png

          ./scripts/generate.sh \
            --prompt "Game-engine terrain heightmap for a volcanic island with radial ridges and a central crater, seamless square 16-bit-style grayscale displacement map, black lowest elevation, white highest elevation, directly overhead orthographic layout" \
            --size 512x512 \
            --steps 4 \
            --seed 42 \
            --output outputs/terrain/prompt-study/03-game-heightmap.png

          ./scripts/generate.sh \
            --prompt "A flat 2D scalar elevation field representing a volcanic island with radial ridges and a central crater, smooth concentric grayscale value gradients, dark low values around the boundary and bright high values toward ridges, scientific raster visualization" \
            --size 512x512 \
            --steps 4 \
            --seed 42 \
            --output outputs/terrain/prompt-study/04-scalar-field.png

          ./scripts/generate.sh \
            --prompt "Orthographic satellite-style terrain map of a volcanic island with radial ridges and a central crater, true nadir view from directly overhead, full island footprint centered in a square map tile, no horizon, consistent scale" \
            --size 512x512 \
            --steps 4 \
            --seed 42 \
            --output outputs/terrain/prompt-study/05-orthophoto-reference.png

      - name: Measure generated candidates
        run: |
          for PNG in outputs/terrain/prompt-study/*.png; do
            echo "=== $PNG ==="
            .venv/bin/python scripts/check_image.py "$PNG"
            .venv/bin/python scripts/check_heightmap.py "$PNG" || true
          done

      - name: Upload generated image (always, for visual inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-generated-image
          path: outputs/terrain/prompt-study/*.png

      - name: Serve smoke test
        run: |
          set -e
          ./scripts/serve.sh > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          for i in $(seq 1 120); do
            if lsof -nP -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1 \
            && lsof -nP -iTCP:3000 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "both ports bound @ ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS --max-time 10 http://localhost:8000/backends
          curl -fsS --max-time 30 -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:3000/
          kill -TERM $SERVE_PID
          sleep 5

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-serve-log
          path: |
            /tmp/serve.log
            .serve-logs/

  windows-x86:
    name: Windows x86 — setup + download
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'smoke-test')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache HF model (ternary-gemlite)
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/bonsai-image-4B-ternary-gemlite
          key: ${{ runner.os }}-${{ runner.arch }}-model-ternary-gemlite-v1

      - name: Run setup.ps1
        env:
          SKIP_DOWNLOAD: "1"
          BONSAI_SKIP_GPU_STACK: "1"
        shell: powershell
        run: .\setup.ps1

      - name: Download ternary-gemlite model (cache miss)
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\download_model.ps1 ternary-gemlite

      - name: Verify .venv + Python imports
        shell: powershell
        run: |
          .venv\Scripts\python.exe -c "import huggingface_hub; print('huggingface_hub ok')"
          .venv\Scripts\python.exe -c "import hf_transfer; print('hf_transfer ok')"

      - name: Verify model files present
        shell: powershell
        run: |
          if (-not (Test-Path 'models\bonsai-image-4B-ternary-gemlite')) {
            Write-Error 'Model directory not found'
          }
          Get-ChildItem 'models\bonsai-image-4B-ternary-gemlite' | Select-Object Name, Length
